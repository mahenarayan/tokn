name: Instructions Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "22 6 * * 1"

permissions:
  contents: read

jobs:
  instructions-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Tokn CLI
        run: npm install --global @tokn-labs/tokn@0.4.0 --ignore-scripts

      - name: Lint repository instructions
        run: |
          tokn instructions-lint . \
            --config ./tokn.config.json \
            --format github

      - name: Write advisory JSON report
        if: ${{ always() }}
        run: |
          tokn instructions-lint . \
            --config ./tokn.config.json \
            --fail-on-severity off \
            --format json \
            > instructions-lint-report.json

      - name: Summarize advisory report
        if: ${{ always() }}
        run: |
          node -e 'const fs = require("node:fs"); const r = JSON.parse(fs.readFileSync("instructions-lint-report.json", "utf8")); console.log(`Tokn scanned ${r.stats.totalFiles} instruction files with ${r.stats.warningCount} warnings and ${r.stats.errorCount} errors.`);'
